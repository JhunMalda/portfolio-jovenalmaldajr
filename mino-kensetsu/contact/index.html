    <section class="sub-contact lower__section mg-tb pd-lr">
      <div class="inner">
        <h2 class="section_ttl center mb20">お問い合わせフォーム</h2>

        <form class="contact__form" id="mailformpro" action="../mailformpro/mailformpro.cgi" method="POST">
          <div class="form-group">
            <label for="company">会社名・団体名</label>
            <input type="text" id="company" name="会社名・団体名" placeholder="例：株式会社〇〇" />
          </div>

          <div class="form-group">
            <label for="name">お名前 <span class="required">*</span></label>
            <input type="text" id="name" name="お名前" placeholder="例：山田太郎" required />
          </div>

          <div class="form-group">
            <label for="email">メールアドレス <span class="required">*</span></label>
            <input type="email" id="email" name="メールアドレス" placeholder="例：example@email.com" required />
          </div>

          <div class="form-group">
            <label for="tel">電話番号</label>
            <input type="tel" id="tel" name="電話番号" placeholder="例：03-1234-5678" />
          </div>

          <div class="form-group">
            <label for="subject">お問い合わせ件名</label>
            <input type="text" id="subject" name="お問い合わせ件名" />
          </div>

          <div class="form-group">
            <label for="message">お問い合わせ内容 <span class="required">*</span></label>
            <textarea id="message" name="お問い合わせ内容" rows="8" placeholder="お問い合わせ内容をご記入ください" required></textarea>
          </div>

          <div class="form-privacy center">
            <input type="checkbox" id="privacy-term" name="プライバシーポリシーに同意" required />
            <label for="privacy-term">
              <a href="../privacy/index.html" target="_blank" rel="noopener noreferrer">プライバシーポリシー</a>を確認し同意する <span class="required">*</span>
            </label>
          </div>

          <p class="required-note center">*は必須入力項目です。</p>

          <div class="center">
            <input type="submit" class="btn01 submit-btn" value="確認する" />
          </div>
        </form>

        <script type="text/javascript" id="mfpjs" src="../mailformpro/mailformpro.cgi" charset="UTF-8"></script>
      </div>
    </section>
